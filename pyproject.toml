[project]
name = "lead-followup-demo"
version = "0.1.0"
description = "Reference architecture for an AI-assisted SMS lead follow-up system"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "bcrypt<4.1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1", # temporary
  "openai>=2.0,<3",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.3.5",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "twilio>=9.3,<10",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

